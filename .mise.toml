# .mise.toml — task runner contract (§6.3: `mise run lint`, `mise run test`, `mise run e2e`, `mise run build`)
# Backend-prefixed pins (`npm:`, `aqua:`, `github:`) live here, not in .tool-versions.

[tools]
# commitlint via mise's npm: backend so the binary lands on PATH across every
# archetype. Earlier the template assumed TS consumers carried commitlint as a
# package.json devDep, but Pattern E preserves the consumer's package.json
# (`_skip_if_exists`), so the assumption broke. mise pinning is the consistent
# audit-side contract — same as how gitleaks/conftest/check-jsonschema work.
"npm:@commitlint/cli" = "21.2.1"
"npm:@commitlint/config-conventional" = "21.2.0"

# Hook tools backing lefthook.yml. Universal across archetypes — every
# archetype's lefthook runs markdownlint/yamllint/prettier and most run
# shellcheck/shfmt. Pinning here is the only way `lefthook run` can
# resolve these binaries on a fresh CI runner (and via `mise exec --` locally
# without polluting the developer's global tool surface).
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh"            = "3.13.1"   # shfmt
"npm:markdownlint-cli2"    = "0.23.1"
"npm:prettier"             = "3.9.6"
"pipx:yamllint"            = "1.38.0"
# lefthook binary itself. The lint-hooks CI job runs `mise exec -- lefthook
# run pre-commit --all-files`, which requires lefthook on PATH from mise (the
# CI runner doesn't carry it natively). Locally developers usually have
# lefthook via Homebrew; pinning here keeps CI and the developer-laptop
# parity. The audit-side .standards/.mise.toml does NOT pin lefthook because
# audit.yml doesn't invoke it — only consumer-side lint-hooks does.
"aqua:evilmartians/lefthook" = "2.1.10"
# gitleaks here mirrors the audit-side pin in .standards/.mise.toml. The
# lefthook pre-commit gitleaks hook invokes a bare `gitleaks git --staged`,
# which needs the binary on PATH — the consumer-side lint-hooks CI job
# doesn't materialize .standards/ so cannot rely on that pin.
"aqua:gitleaks/gitleaks"     = "8.30.1"
# yq — used by the `_tasks` merge-yamllint.sh hook to deep-merge consumer-side
# .yamllint.local into the template-rendered .yamllint at copier render time.
# Pinning universally so consumers can rely on it for their own scripts too.
"aqua:mikefarah/yq"          = "4.53.3"
# copier — the weekly copier-sync reusable workflow (.github/copier-sync.yml)
# runs a bare `copier update`, bootstrapping tools via mise-action. The CI
# runner image does not ship copier, so without this pin the sync job exits
# 127 (command not found). Pinning here lands it on the mise PATH for both CI
# and local `copier update` parity. The reusable workflow also installs copier
# explicitly as belt-and-braces for consumers not yet re-rendered with this pin.
"pipx:copier"                = "9.17.0"
# Node runtime pin — universal (P5-C unification). Every repo runs the
# npm:-backend hook tools above (commitlint / markdownlint / prettier), so the
# node runtime they require is pinned HERE for every repo. Previously most
# repos carried this pin in .tool-versions; that file now holds only the
# python/go pins (ASDF-format toolchains with no backend prefix) and renders
# only when one of those stacks is present.
node = "22.12.0"
# Ruff — Python linter+formatter. The lefthook `ruff-fix` / `ruff-format`
# pre-commit hooks invoke `ruff` directly (no `mise exec --` prefix), so the
# binary must be on PATH at hook-run time. Locally developers usually have
# ruff in the project venv (`pip install -e ".[dev]"` brings it in), but the
# lint-hooks CI job runs `lefthook run pre-commit --all-files` from a fresh
# runner that has no project venv. Pinning here via mise's pipx backend
# lands ruff on PATH the same way yamllint/markdownlint do. The audit-side
# .standards/.mise.toml does NOT pin ruff — audit.yml doesn't invoke it;
# only consumer-side lint-hooks does.
"pipx:ruff"                = "0.15.22"
[tasks.lint]
description = "Lockfile check + Ruff + pyright"
# `uv lock --check` verifies uv.lock is fresh against pyproject.toml — a stale
# lockfile is drift that otherwise surfaces only at deploy/CI-install time
# (floor promoted from fleet's consumer customization — §5.2).
# `uv run` prefix resolves binaries from the project's .venv (managed by uv sync)
# before falling back to mise's PATH. ruff is pinned in [tools] above (lands on
# mise PATH for lefthook hooks); pyright is added by the audit-driven patch into
# [dependency-groups.dev] (lives in .venv). Without `uv run`, `pyright` would not
# be found from a bare mise shell. ruff resolves either way; the prefix is
# consistent across tools and matches `[tasks.test]`'s shape.
#
# py-script archetype (Plan 3 Task 37) splits out below: no pyproject.toml
# means no `uv run` (uv has nothing to resolve from) and no pyright (no
# [dependency-groups.dev] to install pyright into). py-script's [tasks.lint]
# uses bare `mise exec -- ruff check` against the mise-pinned pipx:ruff.
run = ["uv lock --check", "uv run ruff check .", "uv run ruff format --check .", "uv run pyright"]

[tasks.test]
description = "pytest with strict markers + JUnit"
# pytest is installed into the project's .venv via `uv sync` (consumers' dev
# dependency). It is NOT on mise's PATH, so a bare `pytest ...` invocation
# fails with `command not found`. `uv run pytest` resolves the binary from
# .venv first, falling back to mise/system PATH if absent. Matches the
# canonical uv-managed Python project pattern.
run = ["uv run pytest --strict-markers --junitxml=reports/unit/junit.xml"]
