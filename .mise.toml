# Source: Rubio-Enterprises/standards, template/.mise.toml.jinja
# Repo-specific changes go in .mise.local.toml.
# .mise.toml — task runner contract (§6.3: `mise run setup`, `mise run lint`, `mise run test`, `mise run e2e`, `mise run build`)
# Backend-prefixed pins (`npm:`, `aqua:`, `github:`) live here, not in .tool-versions.
#
# Repo-owned tasks and pin overrides go in `.mise.local.toml`, which mise merges
# additively and this template renders nowhere, so nothing there can be reverted.
# Commit it: it is repo policy, not personal config, despite mise's `.local`
# naming (a non-.local home is tracked in standards#662). Machine-local values
# belong in the gitignored `.envrc.local`.
# Test-runner flags belong in that runner's own project config, never appended
# to a task's `run` line.
# The `MD-11` audit rule enforces this on every PR — see
# skills/audit-standards/spec/all-repos.md "Template provenance of `.mise.toml`".

[tools]
# uv — declared FIRST because the `pipx:` pins below cannot install without it
# and every task in this file shells out to it (`uv lock --check`,
# `uv run --frozen …`). mise's pipx backend routes installs through uvx
# (`pipx.uvx` defaults true); with neither uv nor a real pipx binary present,
# `mise install` hard-fails with "pipx is required to install pipx:<tool> but
# was not found" and every downstream hook dies with command-not-found.
#
# Until 2026-09-03 this dependency was UNDECLARED: uv reached CI only via an
# `astral-sh/setup-uv` step each workflow had to remember, and reached laptops
# only via a developer's global install. That made green runs a property of the
# runner image and the mise cache rather than of this file — 20 of 58 repos
# carried a test-gate with no uv step, of which 4 were outright red and 16
# passed only because they happened to land on a runner that already had it.
# Declaring it here makes provisioning mise's job, so the workflow-level
# setup-uv steps become belt-and-braces instead of load-bearing.
#
# Keep this pin paired with any reviewed `python_version` answer bump: verify
# the selected interpreter is downloadable with this exact uv before promoting.
# The injected gates already use uv 0.12.15 (Rubio-Enterprises/.github#212).
uv = "0.12.15"

# commitlint via mise's npm: backend so the binary lands on PATH across every
# archetype. Earlier the template assumed TS consumers carried commitlint as a
# package.json devDep, but Pattern E preserves the consumer's package.json
# (`_skip_if_exists`), so the assumption broke. mise pinning is the consistent
# audit-side contract — same as how gitleaks/conftest/check-jsonschema work.
"npm:@commitlint/cli" = "21.2.2"
"npm:@commitlint/config-conventional" = "21.2.2"

# Hook tools backing lefthook.yml. Universal across archetypes — every
# archetype's lefthook runs markdownlint/yamllint/prettier and most run
# shellcheck/shfmt. Pinning here is the only way `lefthook run` can
# resolve these binaries on a fresh CI runner (and via `mise exec --` locally
# without polluting the developer's global tool surface).
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mvdan/sh" = "3.14.0"  # shfmt
# 2026-08-28: remove this exact fastq exclude once the selected fastq release publishes SLSA provenance.
"npm:markdownlint-cli2" = { version = "0.23.1", trust_policy_excludes = ["fastq@1.20.2"] }
"npm:prettier" = "3.9.6"
"pipx:yamllint" = "1.38.0"
# Fixer dispatcher — render before switching the remote hooks (issue #621).
# Renovate tracks this two-segment aqua pin with the other mise tool floors.
"aqua:numtide/treefmt" = "2.6.0"
"aqua:tombi-toml/tombi" = "1.7.3"
# lefthook binary itself. The lint-hooks CI job runs `mise exec -- lefthook
# run pre-commit --all-files`, which requires lefthook on PATH from mise (the
# CI runner doesn't carry it natively). Locally developers usually have
# lefthook via Homebrew; pinning here keeps CI and the developer-laptop
# parity. The audit-side .standards/.mise.toml does NOT pin lefthook because
# audit.yml doesn't invoke it — only consumer-side lint-hooks does.
"aqua:evilmartians/lefthook" = "2.1.12"
# gitleaks here mirrors the audit-side pin in .standards/.mise.toml. The
# lefthook pre-commit gitleaks hook invokes a bare `gitleaks git --staged`,
# which needs the binary on PATH — the consumer-side lint-hooks CI job
# doesn't materialize .standards/ so cannot rely on that pin.
"aqua:gitleaks/gitleaks" = "8.30.1"
# yq — used by the `_tasks` merge-yamllint.sh hook to deep-merge consumer-side
# .yamllint.local into the template-rendered .yamllint at copier render time.
# Pinning universally so consumers can rely on it for their own scripts too.
"aqua:mikefarah/yq" = "4.53.6"
# copier — the weekly copier-sync reusable workflow (.github/copier-sync.yml)
# runs a bare `copier update`, bootstrapping tools via mise-action. The CI
# runner image does not ship copier, so without this pin the sync job exits
# 127 (command not found). Pinning here lands it on the mise PATH for both CI
# and local `copier update` parity. The reusable workflow also installs copier
# explicitly as belt-and-braces for consumers not yet re-rendered with this pin.
"pipx:copier" = "9.18.1"
# Org-wide Node runtime pin — the single template-owned version for every
# repository, including repos without first-party JS. Renovate bumps it here
# and in standards' root mirror; Copier update PRs deliver it to consumers,
# through the canary ring first. The universal npm: hook tools above need it.
node = "24.21.0"
# Ruff is owned only by this mise pin, never a project dependency group.
# Hooks and tasks use `mise exec -- ruff`, even when a project venv exists.
# Do not add ruff to pyproject.toml.
"pipx:ruff" = "0.16.5"
# Biome owns JSON in every repository; JS/TS coverage follows the facets.
"npm:@biomejs/biome" = "2.5.14"
# CodeWiki backs the `codewiki` task below (has_codewiki, ADR-0026). There is
# no PyPI release, so mise's pipx backend installs it from Git, pinned to the
# upstream commit the org trialled: 2.0.0 plus the Rust analyzer, the
# hierarchical layout, --language and the --update loop fix. CodeWiki needs
# Python >= 3.12; `uvx_args` makes uv build the tool venv on 3.12 whatever the
# project's own interpreter is, and `--excludes` drops pythonmonkey and pminit,
# which need npm to build and which CodeWiki never loads on 3.12 (see
# .config/codewiki-uv-excludes.txt, standards#690). Renovate bumps the commit through standards'
# git-refs custom manager. The inline table keeps normalize-mise-pins.sh and
# the PyPI pipx manager off this line.
"pipx:git+https://github.com/FSoft-AI4Code/CodeWiki.git" = { version = "f0975ea19b17568ceb55cd5422206e1a1ae13c0b", uvx_args = "--python 3.12 --excludes {{config_root}}/.config/codewiki-uv-excludes.txt" }

# Git hooks are per-repo via lefthook since dotfiles commit 2ea15ce retired the
# global dispatcher. Local `mise install` activates them without `mise
# activate`. CI never fires Git hooks; `lint-hooks` runs `lefthook run` with a
# routed standards token. Ungated CI clones the private standards remote
# anonymously, and macOS Tart GCM can wait forever (sshfsctl PR #18, run
# 33554743280, 2026-09-01). Precedents: the v1.55.2-wave fix in
# Rubio-Enterprises/.github lint-hooks.yml and mac-dev-playbook
# config_outrunner.cue #295. Linux hid it because mise only warns on hook
# failure.
[hooks]
postinstall = 'test -n "${CI:-}" || mise exec -- lefthook install'

# Regenerate the GENERATED lint configs (floor ⊕ this repo's `*.local`
# sidecars) without a full `copier update`. Universal rather than facet-gated:
# every onboarded repo carries `.yamllint` + `.markdownlint-cli2.jsonc`, and the
# stack facets add `ruff.toml` / `biome.jsonc` on top.
#
# Invoked through `bash` rather than the script's own exec bit: copier strips
# exec bits from rendered files (see the chmod-claude-scripts.sh rationale in
# copier.yml's `_tasks` block), so relying on it would break on a fresh render.
[tasks.lint-config]
description = "Regenerate generated lint configs from the standards floor + this repo's *.local sidecars"
run = ["bash scripts/regenerate-lint-config.sh"]

# `mise run setup` makes every other task runnable: it installs the pinned
# toolchain, then each stack's dependencies. It is the one setup command for a
# fresh clone, a Dev Container's updateContentCommand and CI. The name follows
# the common convention (Rails `bin/setup`, Phoenix `mix setup`, GitHub's
# scripts-to-rule-them-all `script/setup`); `bootstrap` is avoided because
# `mise bootstrap` runs a `bootstrap` task as the last step of machine
# provisioning, after applying global config such as dotfiles.
#
# The composite depends on the `setup:*` wildcard, so a repo extends setup by
# adding its own `[tasks."setup:<name>"]` in .mise.local.toml (with `depends`
# on any template subtask it needs) instead of overriding `setup` and losing
# the template's subtasks. To replace one stack's step, override that subtask
# there. Every step must be safe to repeat.
[tasks.setup]
description = "Install the toolchain and every stack's dependencies (extend with setup:* tasks in .mise.local.toml)"
depends = ["setup:*"]

[tasks."setup:tools"]
description = "Install the pinned toolchain from [tools]"
run = ["mise install"]

# CodeWiki (has_codewiki, ADR-0026): generate docs/codewiki/ locally, then
# commit it with the change that prompted it. `--update` when a CodeWiki
# exists, a full build otherwise; `mise run codewiki -- --full` forces a
# rebuild and answers CodeWiki's "Overwrite?" prompt. `--dry-run` runs the
# preflight and prints the commands without calling the model.
#
# CodeWiki reads its provider and model only from ~/.codewiki/config.json, so
# the task writes them there on every run. Per-repo overrides go in
# .mise.local.toml [env]: CODEWIKI_MODEL (default claude-opus-5-5),
# CODEWIKI_EFFORT (default medium, exported as CAW_EFFORT) and
# CODEWIKI_EXTRA_INSTRUCTIONS (appended to the shared formatting
# instructions). The claude CLI comes from the machine, not from mise.
#
# CAW_AUTOWAIT=0 turns off CodeWiki's usage-limit auto-wait. Its detector
# (the bundled caw library) scans successful replies for "limit" and
# "resets", so a page that mentions both (e.g. a PR "word limit") made it
# sleep 60 minutes and resume in a loop with no real limit hit. A genuine
# limit now fails the run instead; rerunning resumes from CodeWiki's cache.
[tasks.codewiki]
description = "Generate or update the CodeWiki in docs/codewiki/ (--full rebuilds from scratch)"
usage = '''
flag "--full" help="Rebuild from scratch, overwriting the existing CodeWiki"
flag "--dry-run" help="Run the preflight and print the commands without generating"
'''
shell = "bash -c"
run = '''
set -euo pipefail
out=docs/codewiki
model="${CODEWIKI_MODEL:-claude-opus-5-5}"
effort="${CODEWIKI_EFFORT:-medium}"
min_claude=2.1.280
fail() {
  echo "mise run codewiki: $*" >&2
  exit 1
}
version_ge() {
  awk -v a="$1" -v b="$2" 'BEGIN {
    na = split(a, x, "."); nb = split(b, y, "."); n = (na > nb) ? na : nb
    for (i = 1; i <= n; i++) {
      if (x[i] + 0 > y[i] + 0) exit 0
      if (x[i] + 0 < y[i] + 0) exit 1
    }
    exit 0
  }'
}

command -v claude >/dev/null 2>&1 ||
  fail "the claude CLI is not on PATH. Install Claude Code (dotfiles manage it), then run 'claude auth login'."
claude_version="$(claude --version 2>/dev/null | awk 'NR == 1 { print $1 }')"
case "$claude_version" in
[0-9]*.[0-9]*) ;;
*) fail "could not read the claude CLI version (got '$claude_version')." ;;
esac
version_ge "$claude_version" "$min_claude" ||
  fail "claude $claude_version is too old: CodeWiki's models need Claude Code >= $min_claude. Run 'claude update'."
claude auth status 2>/dev/null | grep -Eq '"loggedIn"[[:space:]]*:[[:space:]]*true' ||
  fail "the claude CLI is not logged in. Run 'claude auth login'."

mode=full
if [ "${usage_full:-false}" != "true" ] && [ -f "$out/metadata.json" ]; then
  mode=update
fi
instructions="Format every Markdown page for markdownlint. Use '-' as the marker for every unordered list item. Put one blank line before and after every heading, every list and every fenced code block. End every file with exactly one trailing newline. Link to a heading only with a '#anchor' fragment that matches the GitHub slug of a heading that exists on the target page. Never put a space just inside the backticks of a code span."
if [ -n "${CODEWIKI_EXTRA_INSTRUCTIONS:-}" ]; then
  instructions="$instructions $CODEWIKI_EXTRA_INSTRUCTIONS"
fi
args=(generate --output "$out" --github-pages)
if [ "$mode" = update ]; then
  args+=(--update)
fi
args+=(--instructions "$instructions")

echo "mise run codewiki: claude $claude_version, model $model, effort $effort, $mode build into $out/"
if [ "${usage_dry_run:-false}" = "true" ]; then
  if [ "${usage_full:-false}" = "true" ]; then
    printf 'would run: rm -rf %q\n' "$out"
  fi
  printf 'would run: codewiki config set --provider claude-code --main-model %q --cluster-model %q\n' "$model" "$model"
  printf 'would run: CAW_EFFORT=%q CAW_AUTOWAIT=0 codewiki' "$effort"
  printf ' %q' "${args[@]}"
  printf '\n'
  exit 0
fi

codewiki config set --provider claude-code --main-model "$model" --cluster-model "$model" >/dev/null
export CAW_EFFORT="$effort"
export CAW_AUTOWAIT=0
# CodeWiki skips every page that already exists, so --full clears the old
# wiki first to make it a real rebuild. Without metadata.json (written last),
# existing pages are a saved partial build: CodeWiki asks "Overwrite?", and
# answering yes keeps them and builds only the missing pages, which resumes it.
if [ "${usage_full:-false}" = "true" ]; then
  rm -rf "$out"
fi
if [ "$mode" = full ]; then
  printf 'y\n' | codewiki "${args[@]}"
else
  codewiki "${args[@]}"
fi

# --update copies the previous dependency graph to *.prev.json for its own
# comparison. Later updates read only *_dependency_graph.json, so drop the
# multi-megabyte scratch copy instead of committing it.
rm -f "$out"/temp/dependency_graphs/*.prev.json
# The markdownlint Fixer fixes what it can; whatever it cannot is listed below.
treefmt "$out" || true
if ! markdownlint-cli2 "$out/**/*.md"; then
  fail "markdownlint errors the Fixer cannot fix remain in $out/ (listed above). They are the model's occasional slips (a broken #anchor, a space inside a code span): fix each line by hand, then commit."
fi
'''

[tasks.lint]
description = "Lockfile check + Ruff + pyright"
# `uv lock --check` verifies uv.lock is fresh against pyproject.toml — a stale
# lockfile is drift that otherwise surfaces only at deploy/CI-install time
# (floor promoted from an onboarded consumer customization — §5.2).
# Ruff runs through mise, not uv: uv prepends .venv/bin and could select a
# second, independently updated ruff. pyright alone uses `uv run` because it
# needs the project's dependencies and is installed in [dependency-groups.dev].
#
# `--frozen` on every `uv run`: use uv.lock exactly as committed, never write
# it. A bare `uv run` silently re-locks a stale lock, so a green test/lint run
# could mask exactly the drift `uv lock --check` exists to report (and, under
# the lint-hooks CI gate, a rewritten tracked file is a failure). Only `uv
# lock` writes the lock; staleness is reported by that check here and by the
# `uv-lockfile-drift` pre-commit hook on the commit that introduced it.
#
# py-script archetype (Plan 3 Task 37) splits out below: no pyproject.toml
# means no `uv run` (uv has nothing to resolve from) and no pyright (no
# [dependency-groups.dev] to install pyright into). py-script's [tasks.lint]
# uses bare `mise exec -- ruff check` against the mise-pinned pipx:ruff.
run = ["uv lock --check", "mise exec -- ruff check .", "mise exec -- ruff format --check .", "uv run --frozen pyright"]

[tasks.test]
description = "pytest with strict markers + JUnit"
# pytest is installed into the project's .venv via `uv sync` (consumers' dev
# dependency). It is NOT on mise's PATH, so a bare `pytest ...` invocation
# fails with `command not found`. `uv run pytest` resolves the binary from
# .venv first, falling back to mise/system PATH if absent. Matches the
# canonical uv-managed Python project pattern.
#
# NEEDING TO DESELECT MARKERS? Put it in pyproject.toml's
# `[tool.pytest.ini_options] addopts`, NOT in this run line. This file is
# template-owned, so a `-m 'not integration'` appended here is drift with a
# fuse on it: the next re-render rewrites the line and the filter silently
# disappears. aw-gateway paid that bill on the v1.55.85 bump — its four
# aw-server integration tests started running on a runner with no server and
# failed with ConnectError, taking test-gate red. pyproject.toml is
# `_skip_if_exists`, so a filter expressed there survives every render, and a
# command-line `-m <marker>` still overrides it for a local run.
run = ["uv run --frozen pytest --strict-markers --junitxml=reports/unit/junit.xml"]

[tasks."setup:py"]
description = "Create the project environment from uv.lock"
depends = ["setup:tools"]
run = ["uv sync --frozen"]
