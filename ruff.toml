# ruff.toml — Config Stub (config_model: native, ADR-0033).
# Extends the shared Ruff floor in the Shared Config Checkout; a missing parent
# is a hard Ruff error, never a fallback to defaults. The floor anchors its
# path patterns at this repository's root.
#
# Repository exceptions go below in Ruff's own syntax: `lint.extend-select`
# adds rules (a `lint.select` here would replace the shared selection and drop
# its ignores), `lint.ignore` adds ignores, `lint.extend-per-file-ignores` and
# `extend-exclude` add path entries, and scalars such as `target-version`
# override.
extend = ".standards-config/config/ruff.toml"
