target-version = "py313"
line-length = 100

[lint]
select = [
  "E", "F", "W",   # pycodestyle, pyflakes
  "I",             # isort
  "N",             # pep8-naming
  "UP",            # pyupgrade
  "B",             # bugbear
  "S",             # bandit (security)
  "T20",           # flake8-print — org floor: data goes through output helpers/loggers, not raw print
  "RUF",           # ruff-specific
]
ignore = [
  "S101",   # allow assert in tests
]

[lint.per-file-ignores]
"**/tests/**/*.py" = ["S", "T20"]

[format]
quote-style = "double"
indent-style = "space"
