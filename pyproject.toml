[project]
name = "rubio-cli-kit"
version = "1.2.1"
description = "Shared CLI-contract helpers and pytest11 contract harness for the Rubio-Enterprises fleet's per-tool CLI repos"
requires-python = ">=3.14.6"
dependencies = [
  "rich>=15.0.0",
  "structlog>=26.1.0",
  "typer>=0.27.0",
]

[project.entry-points.pytest11]
rubio-cli-kit = "rubio_cli_kit.pytest_plugin"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pyright>=1.1.411",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
